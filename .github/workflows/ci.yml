# Draftroom CI: the same gate as `pnpm verify` (lint, typecheck, unit/protocol tests, browser e2e), plus the licence check.
# It cannot run until the repository is published to GitHub; it has never run (docs/DEPLOY.md, "CI").
# Actions are pinned to full commit SHAs (tag in the comment) so a moved tag cannot change the build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from package.json "packageManager" (pnpm@10.34.5).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version # 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The worker shells out to ffmpeg/ffprobe, and the fixture generator needs libx264 + libx265
      # (Ubuntu's ffmpeg has both).
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -n 1

      - name: Lint
        run: pnpm lint

      # Production dependency licences of every app (scripts/licence-check.mjs; docs/EXCALIDRAW-MIGRATION.md
      # §1 goal 1, §2.12, D13): no paid or copyleft licence, tldraw only as the five MIT packages inside
      # packages/tldraw-import. Linux, so sharp's libvips binaries are the ones the worker images use.
      # --before-cutover reports the tldraw packages as "removed at cut-over" until wave 4 removes them
      # (lockfile PR #2); drop the flag in that change.
      - name: Licence check
        run: pnpm licence:check --before-cutover

      - name: Typecheck
        run: pnpm typecheck

      - name: Generate test fixtures
        run: pnpm fixtures

      - name: Unit and protocol tests
        run: pnpm test

      # Two browsers: the Playwright chromium headless shell runs everything except @chrome tests;
      # branded Google Chrome runs the @chrome tests (MP4/H.264 playback, which the shell cannot decode).
      # `install chrome` installs Google Chrome stable via apt (Playwright elevates with sudo).
      - name: Install Playwright browsers
        run: |
          pnpm --filter @draftroom/e2e exec playwright install --with-deps --only-shell chromium
          pnpm --filter @draftroom/e2e exec playwright install --with-deps chrome

      - name: Browser e2e
        run: pnpm e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
