# The theater Lobby on the NAS (deploy/nas/theater/README.md, docs/OPEN-SIGNIN.md). Copied to
# /volume3/Apps/lobby-theater/ by deploy-theater.sh; the sources are under ./src, the secrets under
# ./secrets (mode 600, created on the NAS), the non-secret settings (settings.env) in ./.env.
#
# No published ports: the only way in is the Cloudflare Tunnel (the `tunnel` service, profile `tunnel`,
# started once secrets/tunnel.env exists), which reaches `web:8080`. Data lives in named volumes on the
# NAS's own disks: Postgres, the board rooms (SQLite, never on a network share) and uploaded files.

name: lobby-theater

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-node-health: &node-health
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 60s

services:
  db:
    <<: *hardening
    image: postgres:18-alpine
    env_file: ./secrets/db.env # POSTGRES_PASSWORD
    environment:
      POSTGRES_USER: lobby
      POSTGRES_DB: lobby
    volumes:
      - pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lobby -d lobby"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m
    cpus: 1

  api:
    <<: *hardening
    image: lobby-theater-api:latest
    build:
      context: ./src
      dockerfile: docker/api.Dockerfile
    env_file:
      - ./secrets/shared.env # DRAFTROOM_TICKET_SECRET, DRAFTROOM_INTERNAL_SECRET
      - ./secrets/api.env # DATABASE_URL, DRAFTROOM_WORKER_TOKEN, DRAFTROOM_PARTNER_TOKEN, DRAFTROOM_WEBHOOK_SECRET
    environment:
      NODE_ENV: production
      PORT: "5859"
      DRAFTROOM_DATA_DIR: /var/data
      DRAFTROOM_BLOB_STORE: fs # uploads under /var/data/blobs, on the `files` volume
      PUBLIC_ORIGIN: ${LOBBY_ORIGIN:?LOBBY_ORIGIN missing from .env}
      DRAFTROOM_SYNC_INTERNAL_URL: http://sync:5858
      TRUST_PROXY: "2" # nginx (the socket peer) and the tunnel container
      AUTH_PROVIDER: email
      DRAFTROOM_OPEN_SIGNIN: "1"
      DRAFTROOM_SHARED_WORKSPACE_NAME: ${LOBBY_WORKSPACE_NAME:-Banzerini House}
      # settings.env: email (anyone types any address) and/or google ("Continue with Google").
      DRAFTROOM_OPEN_SIGNIN_METHODS: ${LOBBY_SIGNIN_METHODS:-email}
      DRAFTROOM_GOOGLE_CLIENT_ID: ${LOBBY_GOOGLE_CLIENT_ID:-}
      # Uploads stay on the NAS (1.8 TB free): a roomier per-workspace quota than staging's 5 GB.
      DRAFTROOM_WORKSPACE_QUOTA_MB: "10240"
      # The feature switches staging turns on (render.yaml), each "on" or off. They all default to off.
      DRAFTROOM_DESIGN_PREVIEWS: "on" # Photoshop, Illustrator and TIFF previews
      DRAFTROOM_LIVE_ACTIVITIES: "on" # polls, scales, word clouds
      DRAFTROOM_JOIN_CODES: "on"
      DRAFTROOM_BREAKOUTS: "on"
      DRAFTROOM_DOC_CARDS: "on"
      DRAFTROOM_REMOVE_BACKGROUND: "on" # needs the worker's model (models/u2netp.onnx)
      DRAFTROOM_DECK_IMPORT: "on" # PowerPoint decks, through the office sidecar
      DRAFTROOM_WORKSPACE_ADMIN: "on"
      # AI (owner, 2026-10-20: use theaitre-bot's OpenAI key, OPENAI_API_KEY in secrets/api.env). The token
      # budgets keep Lobby's defaults (400k a workspace, 150k a person, 2M in all, per UTC day); the capture
      # limits are staging's. AI is on for every board unless a board owner or workspace admin turns it off.
      OPENAI_MODEL: gpt-5.4-mini
      DRAFTROOM_FILE_SEARCH: "on" # "Ask the workspace" reads file pages too
      DRAFTROOM_AI_VISION: "on" # photos and board images to notes
      DRAFTROOM_AI_VISION_USER_DAILY: "10"
      DRAFTROOM_AI_VISION_GLOBAL_DAILY: "150"
      DRAFTROOM_AI_VISION_TIMEOUT_MS: "60000"
      DRAFTROOM_AI_TRANSCRIPT_MAX_CHARS: "60000"
      DRAFTROOM_AI_TRANSCRIPT_USER_DAILY: "10"
    volumes:
      - files:/var/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      <<: *node-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5859/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    mem_limit: 768m
    cpus: 2

  sync:
    <<: *hardening
    image: lobby-theater-sync:latest
    build:
      context: ./src
      dockerfile: docker/sync.Dockerfile
    env_file:
      - ./secrets/shared.env
    environment:
      NODE_ENV: production
      PORT: "5858"
      DRAFTROOM_DATA_DIR: /var/data # rooms/board-<id>.sqlite
      DRAFTROOM_API_INTERNAL_URL: http://api:5859
      ALLOWED_ORIGINS: ${LOBBY_ORIGIN:?LOBBY_ORIGIN missing from .env}
      ACCESS_RECHECK_MS: "10000"
      DRAFTROOM_ENGINE: excalidraw
      # Kill switches that are fail-closed: anything but "on" refuses those writes (as on staging).
      DRAFTROOM_REACTIONS: "on" # emoji reactions on notes
      DRAFTROOM_PLANNING: "on" # planning items
      DRAFTROOM_WS_DEFLATE: "off" # as on staging
    volumes:
      - rooms:/var/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *node-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5858/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    stop_grace_period: 30s
    mem_limit: 768m
    cpus: 2

  web:
    <<: *hardening
    image: lobby-theater-web:latest
    build:
      context: ./src
      dockerfile: docker/web.Dockerfile
      args:
        # Inlined at build time: link previews (og:image) and recognising pasted links to this Lobby's
        # boards; the commit for /version.json, so open tabs learn about a new build.
        VITE_PUBLIC_ORIGIN: ${LOBBY_ORIGIN:?LOBBY_ORIGIN missing from .env}
        GIT_COMMIT: ${LOBBY_COMMIT:-unknown}
    read_only: true
    tmpfs:
      - /tmp:size=32m
    depends_on:
      - api
      - sync
    mem_limit: 128m
    cpus: 1

  # Thumbnails, PDF pages, video posters, Office previews and deck import (through `office`), and background
  # removal (with models/u2netp.onnx; without it the worker simply does not offer it).
  worker:
    <<: *hardening
    image: lobby-theater-worker:latest
    build:
      context: ./src
      dockerfile: docker/worker.Dockerfile
    env_file: ./secrets/worker.env # DRAFTROOM_WORKER_TOKEN, nothing else
    environment:
      NODE_ENV: production
      DRAFTROOM_API_URL: http://api:5859
      WORKER_ID: nas-theater-1
      WORKER_CONCURRENCY: "1"
      WORKER_PDF_HEAP_MB: "384"
      OFFICE_SOCKET: /office-jobs/office.sock
      OFFICE_JOBS_DIR: /office-jobs
      DRAFTROOM_BG_MODEL_PATH: /models/u2netp.onnx
    volumes:
      - office-jobs:/office-jobs
      # Placed once by hand (never downloaded by Lobby); sha256-checked by the worker; read-only here.
      - ./models:/models:ro
    user: node
    init: true
    entrypoint: ["node", "apps/worker/src/worker.ts"]
    depends_on:
      api:
        condition: service_healthy
      office:
        condition: service_started
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1000m
    memswap_limit: 1000m
    cpus: 2

  # The Office-document converter (LibreOffice), the worker image's other entry point, as in deploy/nas/worker:
  # no network, read-only, and only the office-jobs volume shared with the worker.
  office:
    <<: *hardening
    image: lobby-theater-worker:latest
    pull_policy: never
    environment:
      NODE_ENV: production
      OFFICE_SOCKET: /office-jobs/office.sock
      OFFICE_JOBS_DIR: /office-jobs
      OFFICE_WORK_DIR: /tmp
    volumes:
      - office-jobs:/office-jobs
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    user: node
    init: true
    entrypoint: ["node", "apps/worker/src/office-sidecar.ts"]
    stop_grace_period: 30s
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2

  tunnel:
    <<: *hardening
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    env_file: ./secrets/tunnel.env # TUNNEL_TOKEN (Cloudflare Zero Trust -> Tunnels)
    depends_on:
      - web
    mem_limit: 128m

volumes:
  pg:
  rooms:
  files:
  office-jobs:
