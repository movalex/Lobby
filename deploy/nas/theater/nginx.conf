# The theater Lobby's single origin (docker/web.Dockerfile, deploy/nas/theater/README.md). Cloudflare ->
# the tunnel container -> here -> api / sync. The headers are staging's (render.yaml) without Clerk.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;

    # The api enforces every upload limit itself and streams bodies; Cloudflare caps a request at 100 MB.
    client_max_body_size 0;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' blob:; img-src 'self' blob: data:; font-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The api keeps the Host and Origin the browser sent (its Origin check compares PUBLIC_ORIGIN). It
    # trusts two hops of X-Forwarded-For (TRUST_PROXY=2): this proxy and the tunnel container.
    location /api/ {
      proxy_pass http://api:5859;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      # The board event stream (server-sent events) must reach the browser as it is written.
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 1h;
      gzip off;
    }

    location /files/ {
      proxy_pass http://api:5859;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_request_buffering off;
      proxy_read_timeout 10m;
    }

    # The board socket (WebSocket to apps/sync).
    location /connect/ {
      proxy_pass http://sync:5858;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    # Excalidraw fonts are part of the build; a missing one must be a 404, never index.html.
    location /excalidraw-assets/ {
      try_files $uri =404;
      expires 30d;
    }

    location /assets/ {
      try_files $uri =404;
      expires max;
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
