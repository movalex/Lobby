# Draftroom STAGING Blueprint (milestone 3 topology: files in Cloudflare R2, no api disk). NOT
# provisioned. Read docs/DEPLOY.md before syncing it: sign-in (Clerk keys) and the tldraw license key
# are still open ("Known blockers"), and every UNVERIFIED item needs a check on the first deploy.
#
# Default cost ~$20/month (docs/DEPLOY.md "Cost"): api + sync on 0.5c-512mb, the smallest paid
# Postgres, a 1 GB sync disk and a free static site. Preview workers run on the NAS
# (deploy/nas/README.md); the Render background worker at the end of this file is OPTIONAL and
# commented out (+$7/month).
#
# Checked on 2026-09-27 against https://render.com/docs/blueprint-spec and Render's published JSON
# schema https://render.com/schema/render.yaml.json (unchanged since 2026-09-26 02:28 GMT; validated
# with and without the optional worker, see docs/DEPLOY.md "Validation"). Plan IDs are the compute-plan
# names Render introduced in August 2026 (https://render.com/docs/compute-plans).
# Render refused `maxShutdownDelaySeconds` on services with a disk on the first sync (2026-09-27); it is
# not used anywhere here (the default 30 s is enough for every service).
#
# Deploy order matters (docs/DEPLOY.md "Deploying"): api (migrations) -> sync -> web (-> worker).
# Automatic deploys are OFF on every service and the Blueprint should be set to Manual Sync: AGENTS.md
# forbids publishing an unreviewed deployment.

envVarGroups:
  # Shared by api and sync. Two independent 256-bit random values (base64, 44 chars; the services
  # require >= 32 chars and that the two differ). Rotating either one restarts both services.
  - name: draftroom-staging-secrets
    envVars:
      - key: DRAFTROOM_TICKET_SECRET
        generateValue: true
      - key: DRAFTROOM_INTERNAL_SECRET
        generateValue: true
  # The preview-worker bearer token (docs/M3-STORAGE-CONTRACTS.md §4), in its OWN group on purpose:
  # a worker must get this token and nothing else. Linking a worker to draftroom-staging-secrets would
  # hand it the ticket secret (= mint a ticket for any board) and the internal secret. Linked to the
  # api (and the optional Render worker). The NAS worker gets the same value by hand: Dashboard ->
  # Environment Groups -> draftroom-staging-worker-token -> reveal, copy into the NAS env file.
  - name: draftroom-staging-worker-token
    envVars:
      - key: DRAFTROOM_WORKER_TOKEN
        generateValue: true # base64 256-bit, 44 chars (the api requires >= 32)

databases:
  - name: draftroom-staging-db
    plan: 0.1c-256mb # smallest paid plan; the free plan expires after 30 days
    diskSizeGB: 1
    postgresMajorVersion: "18" # dev and tests run PGlite = PostgreSQL 18.3
    databaseName: draftroom
    user: draftroom
    region: oregon
    ipAllowList: [] # no external connections; the api connects over Render's private network

services:
  # ---------------------------------------------------------------------------------------------
  # web: the SPA as a static site. VITE_* values are inlined at BUILD time.
  - type: web
    runtime: static
    name: draftroom-staging-web
    # pnpm on Render's native build image is UNVERIFIED; this installs the exact pinned version.
    # Node comes from .node-version (24.19.0).
    buildCommand: >-
      npm install -g pnpm@10.34.5 &&
      pnpm install --frozen-lockfile --filter "@draftroom/web..." &&
      pnpm --filter @draftroom/web build
    staticPublishPath: ./apps/web/dist
    autoDeployTrigger: "off"
    routes:
      # The browser must reach the api on the SAME origin (session cookie is SameSite=Lax, host-only;
      # onrender.com is a public suffix, so the api's own hostname would be cross-site). Rewrites to a
      # full URL are documented; cookie, Origin, query-string and large-upload pass-through are
      # UNVERIFIED (docs/DEPLOY.md "First-deploy checks"). Replace the hostname if Render assigned a
      # different one to the api service.
      - type: rewrite
        source: /api/*
        destination: https://draftroom-staging-api.onrender.com/api/*
      - type: rewrite
        source: /files/*
        destination: https://draftroom-staging-api.onrender.com/files/*
      # Excalidraw's self-hosted fonts (docs/EXCALIDRAW-MIGRATION.md §2.12). A missing file under this
      # prefix must answer 404, never the SPA's index.html: a 200 HTML answer makes the browser take the
      # font as broken and try its next source. Render skips a rule when a file exists at the path, so the
      # real font files are served as-is, and a miss goes to the api, which answers 404. A rewrite to a
      # path that does not exist on this site answers 200 with an empty body instead (measured at the
      # cut-over, docs/CUTOVER-LOG.md A2). Must stay BEFORE the SPA fallback (first matching rule wins).
      - type: rewrite
        source: /excalidraw-assets/*
        destination: https://draftroom-staging-api.onrender.com/excalidraw-assets/*
      # SPA fallback. Render skips rules for paths where a file exists, so hashed assets are served as-is.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # The enforced CSP (docs/EXCALIDRAW-MIGRATION.md §2.12; enforced on staging 2026-10-03 after a real Clerk
      # sign-in under the report-only header showed 0 reports and the feature audit in docs/CUTOVER-LOG.md §7):
      # no 'unsafe-eval' (index.html loads /zod-jitless.js first; Lobby exports SVG with skipInliningFonts, so
      # Excalidraw's eval-based font subsetter never runs), no inline script, fonts same-origin, the sync socket's
      # origin, Clerk's frontend API (a development instance) and its documented hosts (img.clerk.com,
      # clerk-telemetry.com, challenges.cloudflare.com, *.protect.clerk.com for Clerk Protect if it is ever
      # turned on). connect-src blob: is for exports of boards with file cards (the card faces are fetched
      # back from same-origin blob: URLs). A production Clerk instance has another frontend-API host: change
      # it here and on the service together. Changing it needs no rebuild; a static-site Rollback does NOT
      # roll it back (docs/DEPLOY.md). Render applies these headers to the site's own files only, not to
      # responses rewritten to the api (the api's /files answers keep their own sandbox CSP).
      # connect-src names the api's own origin for the board event stream (wave H1): the page fetches it
      # straight from the api (DRAFTROOM_EVENTS_ORIGIN below) because this site's /api/* rewrite holds a
      # streamed response until it ends. Without it the page falls back to the rewrite (no live events).
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' https://splendid-flamingo-3744.clerk.accounts.dev https://challenges.cloudflare.com https://*.protect.clerk.com;
          connect-src 'self' blob: https://draftroom-staging-api.onrender.com https://draftroom-staging-sync.onrender.com wss://draftroom-staging-sync.onrender.com https://splendid-flamingo-3744.clerk.accounts.dev https://clerk-telemetry.com https://*.protect.clerk.com:*;
          img-src 'self' blob: data: https://img.clerk.com;
          font-src 'self';
          style-src 'self' 'unsafe-inline';
          worker-src 'self' blob:;
          frame-src https://challenges.cloudflare.com https://*.protect.clerk.com;
          object-src 'none';
          base-uri 'self';
          form-action 'self';
          frame-ancestors 'none'
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      # Unused since the Excalidraw cut-over (2026-10-01): the current build ignores it. Its Dashboard value
      # is kept only so that a rollback can still rebuild the bridge release R0 (tag lobby-r0). Remove this
      # entry and the Dashboard value together at drop-legacy (docs/EXCALIDRAW-CUTOVER.md D7). Never add
      # VITE_LOBBY_ENGINE back: the switch is gone from the web build.
      - key: VITE_TLDRAW_LICENSE_KEY
        sync: false
      # Static-site rewrites do not proxy WebSockets, so the board socket goes straight to the sync
      # service's public URL (apps/web/src/board/ticket.ts; the ticket authenticates, no cookie needed).
      # Inlined at build time: a hostname change needs a static-site REBUILD. Must match the sync
      # service's onrender.com URL; the sync service's ALLOWED_ORIGINS must list this site's origin.
      - key: VITE_DRAFTROOM_SYNC_ORIGIN
        value: https://draftroom-staging-sync.onrender.com
      # Never set VITE_DRAFTROOM_DEV_AUTH here: it enables development identities in the bundle.

  # ---------------------------------------------------------------------------------------------
  # api: Fastify API only (no preview worker, no ffmpeg), NO disk. Uploads stream to Cloudflare R2,
  # asset metadata and the preview-job queue live in Postgres (docs/M3-STORAGE-CONTRACTS.md), so the
  # container filesystem holds nothing durable and zero-downtime deploys work again.
  - type: web
    runtime: docker
    name: draftroom-staging-api
    plan: 0.5c-512mb # ~125 MB RSS with Postgres (docs/DEPLOY.md); uploads stream, never buffered
    region: oregon
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: "." # quoted: a strict YAML 1.1 parser reads a bare . as a float
    # One instance: the board event hub (SSE) and the rate-limit counters are in-process
    # (apps/api/src/events/hub.ts). A second instance would miss events published by the other.
    numInstances: 1
    # Liveness only: no database, no auth, not rate limited (apps/api/src/app.ts).
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production # also the image default; refuses dev sign-in and dev secrets
      - key: DRAFTROOM_DATA_DIR
        # Scratch only, on the ephemeral container filesystem (lost on every deploy). Nothing durable
        # may live here: blobs are in R2 (DRAFTROOM_BLOB_STORE=r2) and the database is Postgres
        # (DATABASE_URL; without it the api would put PGlite here and lose it on the next deploy).
        value: /tmp/draftroom-api
      - key: DATABASE_URL
        fromDatabase:
          name: draftroom-staging-db
          property: connectionString # internal (private network) URL
      - key: DRAFTROOM_BLOB_STORE
        value: r2
      # Per-workspace file storage (sum of stored originals; docs/SECURITY-REVIEW-2026-09-27.md FC-1).
      # 100 GB in R2 is about $1.50/month when full (the code default is 2 GB).
      - key: DRAFTROOM_WORKSPACE_QUOTA_MB
        value: "102400"
      # Cloudflare R2 (docs/DEPLOY.md "Cloudflare R2"). Prompted once, at Blueprint creation; later
      # Blueprint syncs ignore sync:false values (change them in the Dashboard). Only the api holds
      # these: workers get short-lived presigned URLs, the browser never talks to R2.
      - key: R2_ACCOUNT_ID
        sync: false # the Cloudflare account ID (32 hex characters)
      - key: R2_ACCESS_KEY_ID
        sync: false # bucket-scoped "Object Read & Write" API token
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false # draftroom-staging
      - key: PUBLIC_ORIGIN
        # The static site's URL (Origin checks, Secure cookie, invite links). Confirm the hostname
        # Render assigns on first creation and update it here if it differs.
        value: https://draftroom-staging-web.onrender.com
      - key: DRAFTROOM_EVENTS_ORIGIN
        # This api's own public URL (wave H1, apps/api/src/events/tickets.ts). Pages mint a 30 s single-use
        # ticket through the web origin and open the board event stream straight from here, because the
        # static site's /api/* rewrite holds a streamed response until it ends (measured 2026-10-05: first
        # byte 0.23 s direct, 3.25 s = the whole response through the rewrite). The api then answers CORS
        # for PUBLIC_ORIGIN on that one route. The web's CSP connect-src must name the same origin. Unset =
        # pages use the rewrite (events only arrive with the 40 s stale-stream reconnect). Runtime only: a
        # change needs an api restart, never a web rebuild.
        value: https://draftroom-staging-api.onrender.com
      - key: DRAFTROOM_SYNC_INTERNAL_URL
        # host:port on the private network (e.g. draftroom-staging-sync-xxxx:10000); the api builds
        # http://host:port. Under NODE_ENV=production the api refuses to start without it, or with a
        # loopback address (access-change pushes would silently fail).
        fromService:
          type: web
          name: draftroom-staging-sync
          property: hostport
      - key: TRUST_PROXY
        # A third-party measurement (2026-09-26, docs/DEPLOY.md "Client IPs") shows Render KEEPING
        # client-written X-Forwarded-For entries and appending its own (Cloudflare edge, load balancer,
        # router): trusting 3 hops keys the per-IP sign-in limit on the real client for direct requests
        # without being spoofable; "true" WOULD be spoofable. Requests through the static-site rewrite
        # may carry more hops. UNVERIFIED by us: run the two-network check on the first deploy.
        value: "3"
      - key: AUTH_PROVIDER
        value: clerk # dev sign-in is refused under NODE_ENV=production; the Clerk adapter is UNVERIFIED
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      # Wave J5: who reads the feedback inbox (/feedback) and marks items done: comma-separated exact verified
      # sign-in addresses, at most 25 (docs/DEPLOY.md "Send feedback"). `sync: false` ON PURPOSE, like the creator
      # exceptions: an address is personal data and never goes in git; the lead sets it in the Dashboard. Unset:
      # nobody reads the inbox through the app (GET /internal/feedback, behind the internal secret, still works).
      - key: DRAFTROOM_FEEDBACK_ADMINS
        sync: false
      # AI on the board (apps/api/src/features/ai). The key has NO spending cap at OpenAI: the api's own
      # limits (per call, per person, per workspace, global per day; DRAFTROOM_AI_* in .env.example,
      # contract defaults when unset) are the only brake. Without a key the feature is hidden.
      # DRAFTROOM_AI=off (a Dashboard edit, then a restart) switches it off for everyone.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false # gpt-5.4-mini
      - key: OPENAI_BASE_URL
        sync: false # unset = https://api.openai.com/v1
      - fromGroup: draftroom-staging-secrets
      - fromGroup: draftroom-staging-worker-token

  # ---------------------------------------------------------------------------------------------
  # sync: Lobby's element rooms (the Excalidraw canvas). EXACTLY ONE instance (one authoritative room
  # per board) with its own disk for the per-board SQLite files. No autoscaling, ever: a second
  # instance would open a second room on a different disk and split the board.
  - type: web
    runtime: docker
    name: draftroom-staging-sync
    plan: 0.5c-512mb
    region: oregon
    dockerfilePath: ./docker/sync.Dockerfile
    dockerContext: "." # quoted: a strict YAML 1.1 parser reads a bare . as a float
    numInstances: 1
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    disk:
      name: draftroom-staging-rooms
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DRAFTROOM_DATA_DIR
        value: /var/data # rooms/board-<id>.sqlite live under it
      - key: DRAFTROOM_API_INTERNAL_URL
        # host:port of the api on the private network. Required and non-loopback in production: sync
        # re-checks access against it and fails OPEN when it cannot answer.
        fromService:
          type: web
          name: draftroom-staging-api
          property: hostport
      - key: ALLOWED_ORIGINS
        # Pages allowed to open a board WebSocket (checked before the upgrade; tickets still
        # authenticate). Required in production, https only. Must be the static site's exact origin.
        value: https://draftroom-staging-web.onrender.com
      - key: ACCESS_RECHECK_MS
        value: "10000"
      # The canvas engine: Lobby's element sync (apps/sync/src/engine-switch.ts). Never roll back by
      # changing this value: a rollback deploys the bridge release R0, which ignores it
      # (docs/EXCALIDRAW-CUTOVER.md "Rollback to R0").
      - key: DRAFTROOM_ENGINE
        value: excalidraw
      # "1" = the server starts with maintenance ON (every board socket refused with MAINTENANCE, internal
      # routes working), for a cut-over's first boot and for a roll-forward. Set it in the Dashboard right
      # before that deploy and delete it once maintenance is off (docs/EXCALIDRAW-CUTOVER.md C8, C16, F6).
      # `sync: false` ON PURPOSE: a Blueprint sync must never set it, or every later deploy and restart
      # would start with every board closed. Unset on staging since 2026-10-01 (C16).
      - key: DRAFTROOM_BOOT_MAINTENANCE
        sync: false
      # Offsite board backups (docs/DEPLOY.md "Backups"): each local backup is also copied to R2 under
      # backups/sync/<board>/, with a manifest, signed with a key derived from
      # DRAFTROOM_BACKUP_SIGNING_SECRET, this service's own (never in the env group: the api must not hold
      # it; the key derived from DRAFTROOM_INTERNAL_SECRET only verifies older backups). In production sync
      # refuses to start with the store on and that secret unset. All six are `sync: false` ON PURPOSE,
      # the store too:
      # a Blueprint sync that set DRAFTROOM_BACKUP_STORE=r2 on the existing service without the R2_*
      # values (sync: false values are only prompted at Blueprint creation) would make sync refuse to
      # start, and a sync deploy stops the old instance first. Set all six together in the Dashboard
      # or through the Render API BEFORE deploying the sync build that reads them. Unset = off (boards
      # work; the log says "offsite backups: off").
      #
      # Recommended (docs/DEPLOY.md "Separate backup bucket and token"): a bucket of the backups' own and
      # a token scoped to it alone, set in the Dashboard, never in this file:
      #   DRAFTROOM_BACKUP_R2_BUCKET, DRAFTROOM_BACKUP_R2_ACCESS_KEY_ID, DRAFTROOM_BACKUP_R2_SECRET_ACCESS_KEY
      #   (+ DRAFTROOM_BACKUP_R2_ACCOUNT_ID / DRAFTROOM_BACKUP_R2_ENDPOINT only for another account).
      # Each replaces its R2_* counterpart for backups only; with all three set, remove R2_ACCESS_KEY_ID,
      # R2_SECRET_ACCESS_KEY and R2_BUCKET from this service in the same save (the api keeps its own). They
      # are deliberately not listed as `sync: false` entries: a new Blueprint would prompt for them.
      - key: DRAFTROOM_BACKUP_STORE
        sync: false # r2
      - key: R2_ACCOUNT_ID
        sync: false # the Cloudflare account ID (32 hex characters), as on the api
      - key: R2_ACCESS_KEY_ID
        sync: false # an "Object Read & Write" token scoped to the bucket (docs/DEPLOY.md "Backups")
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false # draftroom-staging
      - key: DRAFTROOM_BACKUP_SIGNING_SECRET
        sync: false # openssl rand -base64 32; different from both secrets in the env group
      - fromGroup: draftroom-staging-secrets

  # ---------------------------------------------------------------------------------------------
  # OPTIONAL (+$7/month): an always-on preview worker on Render, as backup for the NAS worker
  # (deploy/nas/README.md). Not part of the default Blueprint. To enable it, delete the leading "# "
  # from every line of the block below (keep the indentation), then sync the Blueprint. It holds only
  # the worker token: no database, no R2 keys (the api hands it presigned URLs that expire in <= 15 min).
  #
  # DRAFTROOM_API_URL uses the api's PRIVATE-network address (host:port -> http://host:port, like the
  # api <-> sync channel), not its public https URL: the Blueprint wires it without a hostname to guess,
  # the calls never leave Render's private network (background workers may send private traffic; the
  # api's port 10000 receives it; private traffic is not billed), and they skip the Cloudflare edge. The
  # worker accepts plain http in production only for such private hosts (apps/worker/src/env.ts). The
  # NAS worker, outside Render, uses the api's public URL https://draftroom-staging-api.onrender.com.
  #
  # Background workers have no health checks. 512 MB is tight for the PDF child: WORKER_PDF_HEAP_MB is
  # lowered from the default 384 so a huge PDF fails as a job error instead of the instance being
  # OOM-killed (UNVERIFIED on Render; use 1c-2g, $25, and the default heap if PDFs fail here).
  #
  # - type: worker
  #   runtime: docker
  #   name: draftroom-staging-worker
  #   plan: 0.5c-512mb
  #   region: oregon
  #   dockerfilePath: ./docker/worker.Dockerfile
  #   dockerContext: "." # quoted: a strict YAML 1.1 parser reads a bare . as a float
  #   numInstances: 1
  #   autoDeployTrigger: "off"
  #   envVars:
  #     - key: NODE_ENV
  #       value: production
  #     - key: DRAFTROOM_API_URL
  #       fromService:
  #         type: web
  #         name: draftroom-staging-api
  #         property: hostport
  #     - key: WORKER_CONCURRENCY
  #       value: "1"
  #     - key: WORKER_PDF_HEAP_MB
  #       value: "256"
  #     - fromGroup: draftroom-staging-worker-token
