packages:
  - apps/*
  - packages/*
  - e2e

# Single source of truth for shared versions. Reference with "catalog:" in package.json.
catalog:
  # tldraw: only the five MIT packages packages/tldraw-import keeps (D13; docs/EXCALIDRAW-CUTOVER.md G10),
  # in lockstep (they pin each other exactly). tldraw, @tldraw/editor, sync, sync-core and assets left
  # with the tldraw board page (wave 4 part 2, lockfile PR #2) and must not come back.
  '@tldraw/state': 5.4.2
  '@tldraw/store': 5.4.2
  '@tldraw/tlschema': 5.4.2
  '@tldraw/validate': 5.4.2
  '@tldraw/utils': 5.4.2
  # excalidraw (MIT; fractional-indexing CC0): keep all five @excalidraw/* packages at the same exact nightly.
  # Bump only in a dedicated PR that runs the engine probe suite (docs/EXCALIDRAW-MIGRATION.md §6.5), all of it:
  #   - `pnpm test`: the Node probes (apps/web/test/engine-probe: node-probes, editor-open-paths, the addFiles checker)
  #     and the arrow acceptance tests;
  #   - `pnpm probe:browser`: in a mounted <Excalidraw> of the new build, A8's index collision, `addFiles` keeping the
  #     first entry for an id (the derivative swap depends on it) and A3's text layout against the metrics table;
  #   - `pnpm typecheck`: it includes apps/web/test/engine-probe/tsconfig.json and apps/sync/tsconfig.node-safe.json
  #     (the engine core must stay free of DOM globals);
  #   - `pnpm e2e`, `pnpm --filter @draftroom/e2e excalidraw:prod` and `excalidraw:dev`, and `pnpm audit:prod`.
  '@excalidraw/excalidraw': 0.18.0-1118751
  '@excalidraw/element': 0.18.0-1118751
  '@excalidraw/common': 0.18.0-1118751
  '@excalidraw/math': 0.18.0-1118751
  '@excalidraw/fractional-indexing': 0.18.0-1118751
  # react
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  # build / runtime tooling
  typescript: 7.0.2
  '@types/node': 24.19.0
  vite: 8.3.1
  '@vitejs/plugin-react': 6.1.1
  vitest: 5.0.2
  '@playwright/test': 1.63.0
  # axe accessibility audit for the browser suite (e2e only; MPL-2.0 dev tooling, never in a production tree)
  '@axe-core/playwright': 4.13.0
  ws: 8.21.3
  '@types/ws': 8.18.1
  '@biomejs/biome': 2.5.14
  # file previews (apps/worker)
  sharp: 0.35.4
  pdfjs-dist: 6.3.289
  '@napi-rs/canvas': 1.0.9
  pdf-lib: 1.17.1
  '@cantoo/pdf-lib': 2.11.1
  '@pdf-lib/fontkit': 1.1.1
  file-type: 22.1.1
  # api / db (milestone 1)
  fastify: 5.12.5
  "@fastify/cookie": 11.1.2
  "@fastify/rate-limit": 11.2.0
  "@electric-sql/pglite": 0.5.8
  pg: 8.23.0
  "@types/pg": 8.23.1
  zod: 4.6.5
  # object storage (milestone 3): SigV4 signing + presigned URLs for Cloudflare R2 (S3 API); zero deps
  aws4fetch: 1.0.20
  # sign-in provider (adapter; UNVERIFIED until keys exist)
  "@clerk/backend": 3.20.1
  "@clerk/react": 6.17.2

# `pnpm add` must use a catalog version when one exists.
catalogMode: strict

# Supply-chain guard: ignore versions published less than 24h ago (value is minutes).
minimumReleaseAge: 1440
# Exact-version exclusions for pins that are newer than the window (remove once they age out).
minimumReleaseAgeExclude:
  - '@types/node@24.19.0'

# pnpm 10 blocks dependency lifecycle scripts by default. allowBuilds (map form) is accepted by
# pnpm 10.34.5 and is the only form in pnpm 11+. true = may run install scripts, false = skip silently.
# Nothing in this dependency set needs a build script today.
allowBuilds: {}

# Fail the install if a dependency with an unapproved build script shows up.
strictDepBuilds: true

overrides:
  # @types/ws depends on "@types/node": "*", which would pull the newest @types/node (26.x)
  # next to our Node-24 typings. Force one copy everywhere.
  '@types/node': 'catalog:'
  # keep a single ws copy whatever a dependency asks for
  ws: 'catalog:'
  # A6 SEC-dependency-scan (docs/SECURITY-REVIEW-2026-10-02.md): exact-pinned patch fixes for two of the
  # production tree's `pnpm audit --prod` advisories, both inside @excalidraw/excalidraw's own pinned
  # dependencies (exact pins there, so the override is keyed by the version they ask for). Both
  # replacements are versions already resolved elsewhere in this lockfile. Drop each line once
  # Excalidraw's own pin has moved past it.
  'nanoid@3.3.3': 3.3.19
  'lodash-es@4.17.21': 4.18.1

# W5-53 (wave J, J6a): ONE patch of the pinned engine, @excalidraw/element (MIT; the licence text and notice stay in
# the package, `pnpm licence:check` is unchanged). The key is the exact catalog version above; bump the two together.
# What it changes (patches/@excalidraw__element@0.18.0-1118751.patch; dist/dev, dist/prod and the two .d.ts files):
#   - an orbit-mode bound end sits `getOrbitBindingGap` = 1 + strokeWidth / 2 off its target's outline in
#     `updateBoundPoint` (was getBindingGap = 5 + strokeWidth / 2, so connectors stopped 4-6 px short). Nothing else
#     reads it: getBindingGap, BASE_BINDING_GAP and the elbow router's paired padding are untouched.
#   - `getArrowheadPoints` multiplies a head's size by `getArrowheadStrokeScale` = clamp(strokeWidth / 4, 0.4, 1), so the
#     default 2 px stroke gets an arrow head of 12.5 px (was 25, about twice tldraw's) and a 4 px stroke the engine's 25.
# Both are exported (and typed) so the tests can read them: apps/web/src/canvas/engine/arrow-geometry.test.ts fails
# when the patch is not applied. Every consumer that places a bound end (the web engine's live follow, the sync room's
# re-snap, the history roll-forward) resolves this one patched copy, so they agree to the pixel; an unpatched copy of
# any of them would re-snap arrows back to the old gap. Images that install from a manifests-only layer
# (docker/*.Dockerfile, deploy/nas/deploy-worker.sh, scripts/nas-pg-api.sh) must copy patches/ next to this file.
# After any @excalidraw/element bump, regenerate the patch (`pnpm patch @excalidraw/element@<version>`, redo the
# edits listed in the test's header, `pnpm patch-commit`; then restore this file's comments, patch-commit rewrites it).
#
# Wave O (WO-PAN, O-1): the pan speed-ups, no pixel change. The element patch also carries a bound text's bounds cached
# against its container (A2), the frame clip's bounding-box fast path (C) and `isElementInViewportAt` (A1/A4); a second
# patch, of @excalidraw/excalidraw (same exact version, MIT), keeps the renderer's renderable map across camera moves
# (A3), runs its two viewport passes through `isElementInViewportAt` (A1/A4) and memoizes the two embeddable scans of
# every update (E); O-1b reads the viewport pass's bounds from a typed copy kept per renderable map (A5) and decides the
# render-offset pass's elements by offset group (A4b). Both builds (dist/dev, dist/prod) carry every hunk;
# apps/web/test/engine-probe/pan-speed.test.ts and the browser probe (`pnpm probe:browser`: pan) check them (an
# unpatched copy fails there). The edits are a script anchored on this nightly, re-applied after a bump:
# docs/research/excalidraw/wave-o/pan-patch.mjs (its header has the steps).
patchedDependencies:
  '@excalidraw/element@0.18.0-1118751': patches/@excalidraw__element@0.18.0-1118751.patch
  '@excalidraw/excalidraw@0.18.0-1118751': patches/@excalidraw__excalidraw@0.18.0-1118751.patch
