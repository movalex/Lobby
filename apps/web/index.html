<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="application-name" content="Lobby" />
    <meta name="apple-mobile-web-app-title" content="Lobby" />
    <meta name="description" content="Lobby: Dark Burn Creative's collaborative whiteboard. Every DBC project gets its own lobby of boards." />
    <meta name="theme-color" content="#213150" />
    <!-- Wave M (M3-6, S1.2): a board link pasted into a chat tool or a meeting invite unfurls as a generic "Lobby board".
         Every /b/<id> serves this one page, so these tags are static: no board title, thumbnail or word of a board is ever
         in them, and nothing here is read from a board. og:image is an absolute URL built at build time from
         VITE_PUBLIC_ORIGIN (render.yaml: Vite replaces the percent-delimited name when the build has it set, which Render's does;
         a build without it drops the og:image tags, vite.config.ts dropUnsetPublicOrigin) to a brand PNG of this site. The app is for signed-in colleagues, not for search engines: noindex. apps/web/src/lib/link-preview.test.ts
         asserts all of it against the built page. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:site_name" content="Lobby" />
    <meta property="og:title" content="Lobby board" />
    <meta property="og:description" content="Open to view in Lobby" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%VITE_PUBLIC_ORIGIN%/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Lobby" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Lobby</title>
    <!-- Theme before the first paint (no light flash in dark mode): /public/theme-boot.js, the same rules
         as src/theme/theme.ts. A blocking classic script, same-origin: never inline (the Content-Security-Policy
         has no inline-script hash, docs/EXCALIDRAW-MIGRATION.md §2.12; theme.test.ts asserts it). -->
    <script src="/theme-boot.js"></script>
    <!-- zod jitless before any bundle (docs/EXCALIDRAW-MIGRATION.md §2.12: no unsafe-eval): a blocking classic
         script too, since a module script runs after the shared chunk that holds zod; zod-jitless.test.ts asserts it. -->
    <script src="/zod-jitless.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/theme/boot.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
