<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="application-name" content="Lobby" />
    <meta name="apple-mobile-web-app-title" content="Lobby" />
    <meta name="description" content="Lobby: Dark Burn Creative's collaborative whiteboard. Every DBC project gets its own lobby of boards." />
    <meta name="theme-color" content="#213150" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Lobby</title>
    <!-- Theme before the first paint (no light flash in dark mode): /public/theme-boot.js, the same rules
         as src/theme/theme.ts. A blocking classic script, same-origin: never inline (the Content-Security-Policy
         has no inline-script hash, docs/EXCALIDRAW-MIGRATION.md §2.12; theme.test.ts asserts it). -->
    <script src="/theme-boot.js"></script>
    <!-- zod jitless before any bundle (docs/EXCALIDRAW-MIGRATION.md §2.12: no unsafe-eval): a blocking classic
         script too, since a module script runs after the shared chunk that holds zod; zod-jitless.test.ts asserts it. -->
    <script src="/zod-jitless.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/theme/boot.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
