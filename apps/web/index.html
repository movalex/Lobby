<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="application-name" content="Lobby" />
    <meta name="apple-mobile-web-app-title" content="Lobby" />
    <meta name="description" content="Lobby: Dark Burn Creative's collaborative whiteboard. Every DBC project gets its own lobby of boards." />
    <meta name="theme-color" content="#213150" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Lobby</title>
    <!-- Theme before the first paint (no light flash in dark mode): the same rules as
         src/theme/theme.ts (THEME_STORAGE_KEY, resolveColorMode, applyToDocument); theme.test.ts runs
         this script against them. Keep it tiny, classic (not a module) and dependency-free. -->
    <script>
      (() => {
        let pref = 'system'
        try {
          const stored = localStorage.getItem('draftroom:theme')
          if (stored === 'light' || stored === 'dark' || stored === 'system') pref = stored
        } catch {
          // storage blocked: the default (System)
        }
        const dark =
          pref === 'dark' ||
          (pref === 'system' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        const mode = dark ? 'dark' : 'light'
        const root = document.documentElement
        root.setAttribute('data-theme', mode)
        root.setAttribute('data-theme-pref', pref)
        root.style.colorScheme = mode
        const meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', dark ? '#14161b' : '#1f3a5f')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/theme/boot.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
